#-----------------------------------------------------------------------
#
# Minimal DCMQRSCP Configuration for Medical Imaging Migration Service
#
#-----------------------------------------------------------------------

#
# Global Configuration Parameters
#
NetworkTCPPort  = 11116
MaxPDUSize      = 16384
MaxAssociations = 16

HostTable BEGIN
#
# Define DICOM Application Entities
#
migration_scp1    = (MIGRATION_SCP1, localhost, 11112)
migration_scp2    = (MIGRATION_SCP2, localhost, 11114)  
test_client       = (TEST_CLIENT, localhost, 11118)
all_peers         = migration_scp1, migration_scp2, test_client

HostTable END

VendorTable BEGIN
#
# Vendor table (minimal - just define basic vendor)
#
"Migration Service" = all_peers

VendorTable END

AETable BEGIN
#
# Application Entity configuration
# Format: AETitle  StorageArea  Access  Quota  Peers
#
MIGRATION_QR      ./dicom_storage_qr                    RW  (200, 2048mb)  ANY
TEST_CLIENT       ./test_client_storage                 RW  (100, 1024mb)  all_peers
MIGRATION_SCP1    ./dicom_storage_migration_scp1        RW  (100, 1024mb)  ANY
MIGRATION_SCP2    ./dicom_storage_migration_scp2        RW  (100, 1024mb)  ANY

AETable END
