# Simple DCMQRSCP Configuration for Medical Imaging Migration Service

# Global Configuration
NetworkTCPPort = 11116
MaxPDUSize = 16384

# Host definitions
HostTable BEGIN
localhost = 127.0.0.1
HostTable END

# AE Table - Application Entity configuration
AETable BEGIN
#
# Format: AETitle   StorageDirectory   Access  (MaxStudies, Quota)  Peers
#
MIGRATION_QR     ./dicom_storage_qr     RW    (200, 2048mb)    localhost
TEST_CLIENT      ./test_client_storage  RW    (100, 1024mb)    localhost
AETable END

# Vendor Table
VendorTable BEGIN
"*" = "*"
VendorTable END
