# 
# DCMQRSCP Configuration for Medical Imaging Migration Service
#
# This configuration enables DICOM Query/Retrieve services for
# C-FIND, C-GET, and C-MOVE operations between instances.
#

# Network Configuration
NetworkTCPPort       = 11116
MaxPDUSize          = 16384

# Host Table - Define symbolic names for IP addresses
HostTable BEGIN
localhost            = 127.0.0.1
HostTable END

# AE Title Configuration
AETable BEGIN
#
# Each AE which wants to use this query/retrieve service must be configured here.
# Each AE should be configured to use a different storage area.
#
# Format: AE_TITLE  STORAGE_DIRECTORY  ACCESS (MAX_STUDIES, QUOTA) PEER_AE_TITLES
# Access: R = Query/Retrieve only, W = Storage only, RW = Both
#

# Migration Service Storage Areas
MIGRATION_SCP1   ./dicom_storage_migration_scp1   RW (100, 1024mb) localhost:11112 MIGRATION_SCP1
MIGRATION_SCP2   ./dicom_storage_migration_scp2   RW (100, 1024mb) localhost:11114 MIGRATION_SCP2

# Query/Retrieve Service Storage
MIGRATION_QR     ./dicom_storage_qr               RW (200, 2048mb) localhost:11116 MIGRATION_QR

# Test Client Storage  
TEST_CLIENT      ./test_client_storage            RW (50, 1024mb)  localhost:11118 TEST_CLIENT

# Lethologica Instance Storage
LETHOLOGICA_1    ./dicom_storage_migration_scp1   RW (100, 1024mb) localhost:11112 LETHOLOGICA_1
LETHOLOGICA_2    ./dicom_storage_migration_scp2   RW (100, 1024mb) localhost:11114 LETHOLOGICA_2

AETable END

# Vendor Table - Define supported vendors
VendorTable BEGIN
# Format: "VENDOR_NAME" = "SUPPORTED_SOPClassUIDs"
"OFFIS_DCMTK"     = "*"
"*"               = "*"
VendorTable END
