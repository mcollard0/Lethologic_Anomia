#-----------------------------------------------------------------------
#
# DCMQRSCP Configuration for Medical Imaging Migration Service
# Based on /etc/dcmtk/dcmqrscp.cfg format
#
#-----------------------------------------------------------------------

#
# Global Configuration Parameters
#
NetworkTCPPort  = 11116
MaxPDUSize      = 16384
MaxAssociations = 16

HostTable BEGIN
#
# The HostTable defines symbolic names for collections of network
# DICOM Application Entities.
#
# Entry Format: SymbolicName = ( AETitle, HostName, Portnumber ), ...
#
migration_scp1    = (MIGRATION_SCP1, localhost, 11112)
migration_scp2    = (MIGRATION_SCP2, localhost, 11114)
test_client       = (TEST_CLIENT, localhost, 11118)
qr_server         = (MIGRATION_QR, localhost, 11116)
lethologica_1     = (LETHOLOGICA_1, localhost, 11112)
lethologica_2     = (LETHOLOGICA_2, localhost, 11114)

# Combined groups
migration_scps    = migration_scp1, migration_scp2
all_peers         = migration_scp1, migration_scp2, test_client, qr_server

HostTable END

VendorTable BEGIN
#
# The VendorTable is used by the dcmqrscp application to restrict
# access to certain SOP Classes for particular vendors.
#
# The dcmqrti program can use the vendor table to restrict
# move destinations to certain hosts.
#
# Entry Format: VendorName = SymbolicName
# The symbolic name should refer to a set of SOP Class UIDs.
# The special symbolic name "*" can be used to specify all SOP classes.
#
"*" = "*"

VendorTable END

AETable BEGIN
#
# Each DICOM Application Entity which wants to use this server must be
# configured here. Each AE should be configured to use a separate
# storage area.
#
# Entry Format: AETitle  StorageArea  Access  (Quota,...)  Peers
# StorageArea is a directory path
# Access can be R (read), W (write) or RW (read/write)
# Quota format: (maxStudies, storageQuota)
#

MIGRATION_QR      ./dicom_storage_qr        RW  (200, 2048mb)  all_peers
TEST_CLIENT       ./test_client_storage     RW  (100, 1024mb)  migration_scps
MIGRATION_SCP1    ./dicom_storage_migration_scp1  RW  (100, 1024mb)  all_peers  
MIGRATION_SCP2    ./dicom_storage_migration_scp2  RW  (100, 1024mb)  all_peers
LETHOLOGICA_1     ./dicom_storage_migration_scp1  RW  (100, 1024mb)  all_peers
LETHOLOGICA_2     ./dicom_storage_migration_scp2  RW  (100, 1024mb)  all_peers

AETable END
